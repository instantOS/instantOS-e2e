name: e2e
run-name: "e2e: instantCLI ${{ inputs.product_ref || 'main' }} [${{ inputs.profile || 'minimal' }}][${{ github.event_name == 'schedule' && 'live+offline' || inputs.flow || 'live' }}]${{ inputs.smoke == true && ' (smoke)' || '' }}"
on:
  schedule:
    # Nightly; TCG (no KVM on hosted runners) so the full install takes ~1 h.
    # Every nightly runs two jobs in parallel on separate runners:
    #   install-e2e   the online install, from the stock Arch ISO
    #   offline-e2e   a networkless install, from the *published* instantOS
    #                 offline ISO (Phase 3 acceptance, instantOS/offlineiso.md)
    # The non-live flows need ~1.5 h under TCG and are only worth their cost
    # on demand (workflow_dispatch).
    - cron: "40 2 * * *"
  workflow_dispatch:
    inputs:
      product_ref:
        description: "instantCLI ref to test (tag, branch or sha)"
        default: "main"
        type: string
      flow:
        description: "What to boot: the Arch ISO (online install), the published instantOS offline ISO (no NIC), or a running OS that installs onto a second disk"
        type: choice
        options:
          - live
          - offline
          - host-arch
          - host-ubuntu
        default: live
      smoke:
        description: "Smoke only (boot + in-VM dry-run, ~5 min)"
        type: boolean
        default: false
      profile:
        description: "Questions fixture profile"
        type: choice
        options:
          - minimal
          - full
          - encrypted
        default: minimal

permissions:
  contents: read

concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  install-e2e:
    # The offline install is its own job: different ISO, and it tests the
    # published artifact instead of a checkout, so it needs no instantCLI
    # build. This one covers the online install and the non-live flows.
    if: github.event_name == 'schedule' || inputs.flow != 'offline'
    name: ins arch install e2e (${{ inputs.flow || 'live' }}, isotovideo, TCG)
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    # host-ubuntu is red by design against instantCLI dev: it asserts that
    # `ins arch exec` refuses a foreign distro *before* touching the target
    # disk, and exec has no host-profile gate — only `ins arch install` has
    # one, and this flow does not use it. Run it and publish the failure as
    # the signal it is, rather than letting it mask a real regression in the
    # other flows. See casedir/tests/host_install.pm and docs/FINDINGS.md.
    env:
      E2E_MEDIA_DIR: ${{ github.workspace }}/e2e-media
      E2E_WORK_DIR: ${{ github.workspace }}/e2e-work
      INSTANTCLI_DIR: ${{ github.workspace }}/instantCLI
      HOST_BUNDLE: ${{ github.workspace }}/e2e-work/images/${{ inputs.flow == 'host-arch' && 'arch-host' || 'ubuntu-host' }}
    steps:
      - name: Checkout e2e suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check harness
        run: ./tests/run.sh

      - name: Checkout instantCLI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: instantOS/instantCLI
          ref: ${{ inputs.product_ref || 'main' }}
          path: instantCLI

      - name: Resolve current ISO checksum
        id: iso
        # Only the live-ISO flow needs an ISO at all; host flows
        # direct-boot a disk image with KERNEL/INITRD/APPEND.
        if: (inputs.flow || 'live') == 'live'
        run: |
          SUM=$( (curl -fsSL https://archlinux.org/iso/latest/sha256sums.txt 2>/dev/null || \
                  curl -fsSL https://geo.mirror.pkgbuild.com/iso/latest/sha256sums.txt) |
            awk '$2 == "archlinux-x86_64.iso" {print $1}')
          [ -n "$SUM" ] || { echo "could not resolve ISO checksum" >&2; exit 1; }
          echo "sum=$SUM" >> "$GITHUB_OUTPUT"

      - name: Cache Arch ISO
        id: iso-cache
        if: (inputs.flow || 'live') == 'live'
        uses: actions/cache@v4
        with:
          # Keyed by sha256: one download per ISO release, not per run.
          # Nightly runs keep the entry warm (unused entries expire in 7 days).
          path: ${{ github.workspace }}/e2e-media/archlinux-x86_64.iso
          key: archiso-${{ steps.iso.outputs.sum }}

      - name: Download and verify Arch ISO (cache miss only)
        if: (inputs.flow || 'live') == 'live' && steps.iso-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$E2E_MEDIA_DIR"
          ISO="$E2E_MEDIA_DIR/archlinux-x86_64.iso"
          TMP="$ISO.tmp"
          PRIMARY="https://fastly.mirror.pkgbuild.com/iso/latest/archlinux-x86_64.iso"
          FALLBACK="https://geo.mirror.pkgbuild.com/iso/latest/archlinux-x86_64.iso"
          curl -fL --retry 5 --retry-connrefused --retry-delay 2 -o "$TMP" "$PRIMARY" || \
            curl -fL --retry 5 --retry-connrefused --retry-delay 2 -o "$TMP" "$FALLBACK"
          echo "${{ steps.iso.outputs.sum }}  $TMP" | sha256sum -c -
          mv "$TMP" "$ISO"

      # Cache the whole bundle, keyed by the versioned build recipes.
      - name: Install host-image tools
        if: startsWith(inputs.flow, 'host-')
        run: |
          sudo apt-get update
          sudo apt-get install -y fdisk e2fsprogs qemu-utils

      - name: Restore host image
        id: host-cache
        if: startsWith(inputs.flow, 'host-')
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.HOST_BUNDLE }}
          key: hostimg-${{ inputs.flow }}-${{ hashFiles('tools/mkhost.sh', 'tools/host/*.sh', 'tools/lib/*.sh', 'assets/questions-minimal.toml') }}

      - name: Build host image
        if: startsWith(inputs.flow, 'host-') && steps.host-cache.outputs.cache-hit != 'true'
        run: ./tools/mkhost.sh ${{ inputs.flow == 'host-arch' && 'arch' || 'ubuntu' }}

      # Save before the test: the deliberately red Ubuntu flow still needs a cache.
      - name: Save host image
        if: startsWith(inputs.flow, 'host-') && steps.host-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.HOST_BUNDLE }}
          key: ${{ steps.host-cache.outputs.cache-primary-key }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: instantCLI
          prefix-key: e2e-release
          # Save even when the e2e run fails: a nightly installer suite goes
          # red regularly, and a failed run must not leave the next one cold.
          cache-on-failure: true

      - name: Run e2e suite
        # Allow the known product gap, while keeping preparation/check failures fatal.
        continue-on-error: ${{ inputs.flow == 'host-ubuntu' }}
        run: |
          ./run.sh --flow ${{ inputs.flow || 'live' }} QEMUCPUS=4 \
            --profile ${{ inputs.profile || 'minimal' }} \
            ${{ inputs.smoke == true && '--smoke' || '' }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-results
          path: |
            casedir/testresults/
            casedir/ulogs/
            casedir/virtio_console.log
            casedir/virtio_console_user.log
            casedir/serial0
            casedir/vars.json
            casedir/autoinst-status.json
            diag/verifydisk/testresults/
            diag/verifydisk/ulogs/
            diag/verifydisk/virtio_console.log
            diag/verifydisk/virtio_console_user.log
            diag/verifydisk/serial0
            diag/verifydisk/vars.json
            diag/verifydisk/autoinst-status.json
          if-no-files-found: ignore
          retention-days: 14

  # Networkless install from the instantOS offline ISO — the acceptance
  # criterion of Phase 3 in instantOS/offlineiso.md: install, reboot, and no
  # file:// pacman reference may survive on the target. QEMU gets no NIC at
  # all (run.sh --flow offline -> OFFLINE_SUT), so a bundle gap cannot be papered
  # over by the network.
  offline-e2e:
    if: github.event_name == 'schedule' || inputs.flow == 'offline'
    name: ins arch offline install e2e (published ISO, no NIC, TCG)
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    env:
      E2E_MEDIA_DIR: ${{ github.workspace }}/e2e-media
      # SourceForge always serves the newest offline build from this one stable
      # name (instantOS/iso/publish-sourceforge.py promotes latest/ atomically),
      # so the file name never changes — the published sha256 identifies it.
      E2E_ISO_NAME: instantos-offline-latest.iso
      OFFLINE_ISO_URL: https://sourceforge.net/projects/instantos/files/offline/latest/instantos-offline-latest.iso/download
      OFFLINE_ISO_SHA_URL: https://sourceforge.net/projects/instantos/files/offline/latest/instantos-offline-latest.iso.sha256/download
      OFFLINE_BUILD_URL: https://sourceforge.net/projects/instantos/files/offline/latest/build.txt/download
    steps:
      - name: Checkout e2e suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check harness
        run: ./tests/run.sh

      # instantCLI is deliberately NOT checked out here: the unit under test is
      # the published ISO, including its packaged installer (or a build-time
      # LOCAL_INS_BIN override), so `product_ref` does not apply to this job.

      - name: Free runner disk space
        # ~4.3 GiB ISO plus a 20 GiB install target do not fit next to the
        # preinstalled toolchains. Only non-node toolchains are removed:
        # /opt/hostedtoolcache holds the node that the remaining JS actions
        # (actions/cache, upload-artifact) run on.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/share/powershell
          df -h /

      - name: Resolve published offline ISO checksum
        id: offline-iso
        run: |
          # "<sha256>  instantos-offline-latest.iso", published next to the ISO.
          SUM=$(curl -fsSL --retry 5 --retry-connrefused --retry-delay 2 "$OFFLINE_ISO_SHA_URL" | awk '{print $1}')
          [ "${#SUM}" -eq 64 ] || { echo "could not resolve offline ISO checksum" >&2; exit 1; }
          echo "sum=$SUM" >> "$GITHUB_OUTPUT"
          # Build id (build-<workflow run>-<attempt> in the instantOS repo) so a
          # red nightly says which published build it was testing. Informational.
          echo "testing instantOS offline build $(curl -fsSL --max-time 30 "$OFFLINE_BUILD_URL" 2>/dev/null || echo unknown)"
          echo "sha256: $SUM"

      - name: Cache instantOS offline ISO
        id: offline-iso-cache
        uses: actions/cache@v4
        with:
          # Compressed ISO: one cache entry per published checksum.
          path: ${{ env.E2E_MEDIA_DIR }}/instantos-offline-latest.iso
          key: offlineiso-v1-${{ steps.offline-iso.outputs.sum }}

      - name: Download and verify instantOS offline ISO (cache miss only)
        if: steps.offline-iso-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$E2E_MEDIA_DIR"
          ISO="$E2E_MEDIA_DIR/$E2E_ISO_NAME"
          TMP="$ISO.tmp"
          # The /download path redirects to a SourceForge mirror; -L follows it.
          # Download to a temp name and only move the verified file into place,
          # so a truncated or corrupt fetch can never be cached or booted.
          curl -fL --retry 5 --retry-connrefused --retry-delay 2 --progress-bar \
            -o "$TMP" "$OFFLINE_ISO_URL"
          echo "${{ steps.offline-iso.outputs.sum }}  $TMP" | sha256sum -c -
          mv "$TMP" "$ISO"
          ls -lh "$ISO"

      - name: Run e2e suite (offline, no NIC)
        # run.sh --flow offline switches the suite to the shipped ins on the ISO,
        # types the questions fixture in over serial (no asset server, no cargo
        # build) and disables guest networking with OFFLINE_SUT.
        run: |
          ./run.sh --flow offline QEMUCPUS=4 --profile ${{ inputs.profile || 'minimal' }} \
            ${{ inputs.smoke == true && '--smoke' || '' }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # Distinct name: the online job uploads its own e2e-results, and
          # artifact names must be unique within a run.
          name: e2e-results-offline
          path: |
            casedir/testresults/
            casedir/ulogs/
            casedir/virtio_console.log
            casedir/virtio_console_user.log
            casedir/serial0
            casedir/vars.json
            casedir/autoinst-status.json
          if-no-files-found: ignore
          retention-days: 14
