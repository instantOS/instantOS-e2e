# Encrypted configuration for `ins arch exec` e2e tests.
# Full profile (instantOS packages + Plymouth) plus LUKS encryption.
#
# The installer configures GRUB cryptodisk (GRUB_ENABLE_CRYPTODISK=y) and
# sd-encrypt with an LVM volume inside the LUKS container, so /boot lives on
# the encrypted partition: at boot the VM asks for the passphrase TWICE
# (once for GRUB, once for the initramfs) — tests/verify.pm handles that.
#
# Hand-editable on purpose: `ins arch exec --trust-config` accepts configs
# without dependency-provenance records (answers are still validated).
completed_steps = []
step_dependency_fingerprints = {}

[answers]
Hostname = "ins-e2e-vm"
Username = "tester"
Password = "correct-horse-battery-staple"
EncryptionPassword = "correct-horse-battery-staple"
Keymap = "us"
Disk = "/dev/vda"
PartitioningMethod = "automatic"
MirrorRegion = "Germany"
Timezone = "Europe/Berlin"
Locale = "en_US.UTF-8"
Kernel = "linux"
DesktopEnvironment = "none/tty"
RootFilesystem = "ext4"
UseEncryption = "yes"
UsePlymouth = "yes"
LogUpload = "no"
MinimalMode = "no"

[system_info]
boot_mode = "BIOS"
has_amd_cpu = false
has_intel_cpu = true
gpus = [{ Other = "QEMU Virtual Video" }]
vm_type = "kvm"
internet_connected = true
architecture = "x86_64"
distro = "arch"
total_ram_gb = 8
