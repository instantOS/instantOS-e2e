# Encrypted configuration for `ins arch exec` e2e tests.
# Full profile (instantOS packages + Plymouth) plus LUKS encryption.
#
# /boot is unencrypted and contains all GRUB assets. Linux sd-encrypt unlocks
# the LVM-on-LUKS2 root container with one passphrase prompt.
#
# Hand-authored configs omit wizard provenance; `ins arch exec` still
# validates their answers before execution.
completed_steps = []
step_dependency_fingerprints = {}

[answers]
Hostname = "ins-e2e-vm"
Username = "tester"
Password = "correct-horse-battery-staple"
EncryptionPassword = "correct-horse-battery-staple"
Keymap = "us"
Disk = "/dev/vda"
PartitioningMethod = "automatic"
MirrorRegion = "Germany"
Timezone = "Europe/Berlin"
Locale = "en_US.UTF-8"
Kernel = "linux"
DesktopEnvironment = "none/tty"
RootFilesystem = "btrfs"
BtrfsCompression = "zstd"
UseEncryption = "yes"
UsePlymouth = "yes"
LogUpload = "no"
MinimalMode = "no"

[system_info]
boot_mode = "BIOS"
has_amd_cpu = false
has_intel_cpu = true
gpus = [{ Other = "QEMU Virtual Video" }]
vm_type = "kvm"
internet_connected = true
architecture = "x86_64"
distro = "arch"
total_ram_gb = 8
