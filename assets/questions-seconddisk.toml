# Second-disk configuration for the `--host-arch` / `--host-ubuntu` e2e flows.
#
# Identical to questions-minimal.toml except for one line: the target is
# /dev/vdb, the *blank* second disk, while the running host OS lives on
# /dev/vda. That is the whole point of the non-live flow — nothing about the
# running system may be touched, and the disk guard in
# questions/disk.rs::validate must let a different disk through.
#
# Hand-editable on purpose: `ins arch exec` accepts configs without wizard
# provenance (answers are still validated).
completed_steps = []
step_dependency_fingerprints = {}

[answers]
Hostname = "ins-e2e-vm"
Username = "tester"
Password = "correct-horse-battery-staple"
Keymap = "us"
Disk = "/dev/vdb"
PartitioningMethod = "automatic"
MirrorRegion = "Germany"
Timezone = "Europe/Berlin"
Locale = "en_US.UTF-8"
Kernel = "linux"
DesktopEnvironment = "none/tty"
RootFilesystem = "ext4"
UseEncryption = "no"
UsePlymouth = "no"
LogUpload = "no"
MinimalMode = "yes"

[system_info]
boot_mode = "BIOS"
has_amd_cpu = false
has_intel_cpu = true
gpus = [{ Other = "QEMU Virtual Video" }]
vm_type = "kvm"
internet_connected = true
architecture = "x86_64"
distro = "arch"
total_ram_gb = 8
